<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CANARY MINE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="crt" class="crt">
    <section id="title-screen" class="screen active">
      <div class="title-content">
        <h1 class="brand">CANARY<br />MINE</h1>
        <p class="tagline">Learn stack canaries. 12 short levels.</p>
        <canvas id="title-bird" width="96" height="96" aria-hidden="true"></canvas>
        <button id="btn-start" class="pixel-btn primary" type="button">START</button>
      </div>
    </section>

    <section id="game-screen" class="screen">
      <header class="bar">
        <span class="brand-mini">CANARY MINE</span>
        <span id="level-label" class="level-chip">LV.1</span>
        <span id="canary-status" class="status alive">ALIVE</span>
        <span id="guard-status" class="status on">GUARD ON</span>
      </header>

      <p id="dialogue" class="dialogue">...</p>

      <canvas id="mine-canvas" width="480" height="240" role="img" aria-label="Coal mine with canary"></canvas>

      <div id="terminal" class="terminal">
        <div id="term-output" class="term-output"></div>
        <form id="term-form" class="term-form" autocomplete="off">
          <span class="prompt">&gt;</span>
          <input id="term-input" type="text" maxlength="64" spellcheck="false" placeholder="type then ENTER" />
        </form>
      </div>

      <div class="actions">
        <button id="btn-hint" class="pixel-btn" type="button">HINT</button>
        <button id="btn-reset" class="pixel-btn" type="button">RESET</button>
        <button id="btn-next" class="pixel-btn primary" type="button" hidden>NEXT ▶</button>
      </div>

      <!-- ponytail: stack/code stay optional so the main loop stays one screen -->
      <details class="more">
        <summary>Peek under the hood (stack + C)</summary>
        <p id="objective" class="sr-only"></p>
        <p><code id="binary-name"></code> · <code id="compile-line"></code></p>
        <div id="stack-view" class="stack-view"></div>
        <pre id="code-view" class="code-view"></pre>
        <span id="code-file" class="sr-only"></span>
        <span id="mine-mode" class="sr-only"></span>
        <span id="stack-mode" class="sr-only"></span>
      </details>
    </section>

    <section id="win-screen" class="screen">
      <div class="title-content">
        <h1 class="brand small">DONE</h1>
        <p class="tagline">Canary dies so the return address doesn't have to.</p>
        <button id="btn-replay" class="pixel-btn primary" type="button">AGAIN</button>
      </div>
    </section>
  </div>

  <!-- hidden stub so older drawForeman calls no-op safely -->
  <canvas id="foreman" width="1" height="1" hidden></canvas>

  <script src="lesson_bundle.js"></script>
  <script src="levels.js"></script>
  <script src="render.js"></script>
  <script src="game.js"></script>
</body>
</html>
